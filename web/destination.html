<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Tourism | Destination</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Starfield & Subtle Space Background on Pure Black */
    #spaceCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Space Tourism Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0 1.5rem 3rem;
    }

    .logo {
      width: 44px;
      height: 44px;
      background: #ffffff;
      color: #000000;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 1.4rem;
    }

    .nav-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 -1.5rem 0 2.5rem;
      z-index: 2;
    }

    nav {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0 5rem 0 3.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2.5rem;
    }

    nav a {
      display: inline-block;
      padding: 1.6rem 0;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 2.5px;
      font-size: 0.9rem;
      text-transform: uppercase;
      border-bottom: 3px solid transparent;
      transition: border-color 0.25s ease;
    }

    nav a b {
      margin-right: 0.45rem;
    }

    nav a.active,
    nav a:hover {
      border-bottom-color: #ffffff;
    }

    /* Main Content */
    main {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 2rem 3.5rem;
      text-align: center;
      flex: 1;
    }

    .page-heading {
      text-align: left;
      font-size: 1.35rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .page-heading span {
      opacity: 0.35;
      font-weight: 700;
      margin-right: 0.8rem;
    }

    .sub-hint {
      text-align: left;
      color: #D0D6F9;
      font-size: 0.92rem;
      margin-bottom: 1.5rem;
      opacity: 0.85;
    }

    /* 3D Orbit Wheel (9 Smaller Cards) */
    .viewport {
      width: 100%;
      height: 310px;
      perspective: 1200px;
      display: grid;
      place-items: center;
      cursor: grab;
      user-select: none;
      margin-top: 0.5rem;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .ring {
      position: relative;
      width: 195px;
      height: 240px;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: #ffffff;
      box-shadow: 0 0 22px rgba(208, 214, 249, 0.35);
    }

    .card canvas,
    .card img {
      width: 100%;
      height: 75%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card-info {
      height: 25%;
      padding: 0.45rem 0.75rem;
      text-align: left;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-info span {
      font-size: 0.68rem;
      letter-spacing: 1.8px;
      color: #D0D6F9;
      text-transform: uppercase;
    }

    .card-info h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.98rem;
      font-weight: 400;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Lower Spin & Controls Bar */
    .controls-wrapper {
      margin-top: 3.5rem;
      display: flex;
      justify-content: center;
    }

    .controls {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    button {
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 30px;
      font-size: 0.8rem;
      transition: transform 0.15s, background 0.2s, color 0.2s;
    }

    .btn-spin {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 0.65rem 1.6rem;
      font-weight: 700;
    }

    .btn-spin:hover {
      transform: scale(1.04);
      background: #D0D6F9;
    }

    .btn-reset {
      background: transparent;
      color: #D0D6F9;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 0.6rem 1.2rem;
    }

    .btn-reset:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    .ctrl-label {
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #D0D6F9;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Pop-Out Modal with Individual Photo Timeline & Data */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      place-items: center;
      z-index: 99;
      padding: 1rem;
    }

    .modal.open {
      display: grid;
    }

    .panel {
      background: #080A10;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      max-width: 940px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      overflow: hidden;
      position: relative;
      text-align: left;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.35rem 0.85rem;
      z-index: 10;
    }

    .close-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    .img-box {
      position: relative;
      background: #000000;
      min-height: 410px;
      overflow: hidden;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.35s ease, transform 0.35s ease;
    }

    .reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92px;
      height: 92px;
      transform: translate(-50%, -50%);
      border: 1px dashed rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
    }

    .trail-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(208, 214, 249, 0.85), transparent);
      pointer-events: none;
    }

    .details {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.1rem;
    }

    .tag {
      color: #D0D6F9;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .details h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.6rem;
      font-weight: 400;
      text-transform: uppercase;
      margin: 0.25rem 0 0.6rem;
    }

    .desc {
      color: #D0D6F9;
      line-height: 1.55;
      font-size: 0.92rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
      margin-top: 1rem;
    }

    .stats span {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #D0D6F9;
      text-transform: uppercase;
    }

    .stats strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.2rem;
      font-weight: 400;
      text-transform: uppercase;
    }

    /* Write-in Date Control */
    .date-input-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .date-input-row label {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #D0D6F9;
    }

    .date-input-row input {
      background: #000000;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 0.42rem 0.75rem;
      border-radius: 6px;
      font-size: 0.82rem;
      flex: 1;
      min-width: 140px;
    }

    .btn-show {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 0.45rem 0.95rem;
      font-weight: 700;
      font-size: 0.72rem;
    }

    /* Individual Photo Smooth Timeline with Rocket */
    .photo-timeline {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0.95rem 1.1rem 0.85rem;
    }

    .tl-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #D0D6F9;
      margin-bottom: 1.1rem;
    }

    .tl-track-wrap {
      position: relative;
      height: 28px;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .tl-base-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .tl-progress-line {
      position: absolute;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #6b8cff, #ffffff);
      box-shadow: 0 0 10px rgba(208, 214, 249, 0.8);
      border-radius: 2px;
    }

    .tl-rocket {
      position: absolute;
      left: 0%;
      transform: translate(-50%, -50%) rotate(45deg);
      top: 50%;
      font-size: 1.15rem;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
      pointer-events: none;
      z-index: 3;
    }

    .tl-nodes {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }

    .tl-node {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #080A10;
      border: 2px solid rgba(255, 255, 255, 0.45);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }

    .tl-node.active,
    .tl-node:hover {
      border-color: #ffffff;
      background: #D0D6F9;
      transform: scale(1.25);
    }

    .tl-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.45rem;
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: rgba(208, 214, 249, 0.75);
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      .panel {
        grid-template-columns: 1fr;
      }
      .img-box {
        min-height: 230px;
      }
      .nav-line {
        display: none;
      }
      header {
        padding-left: 1.5rem;
      }
      nav {
        padding: 0 1.5rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="spaceCanvas"></canvas>

  <div class="page-wrap">
    <header>
      <div class="logo">✦</div>
      <div class="nav-line"></div>
      <nav>
        <ul>
          <li><a href="home.html"><b>00</b> Home</a></li>
          <li><a href="destination.html" class="active"><b>01</b> Destination</a></li>
          <li><a href="crew.html"><b>02</b> Crew</a></li>
          <li><a href="technology.html"><b>03</b> Technology</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-heading"><span>01</span> Pick your destination</h1>
      <p class="sub-hint">Drag or spin the ring, then click any of the 9 destinations to open its timeline and telemetry.</p>

      <div class="viewport" id="vp">
        <div class="ring" id="ring"></div>
      </div>

      <div class="controls-wrapper">
        <div class="controls">
          <button class="btn-spin" id="spin">Spin Orbit</button>
          <label class="ctrl-label"><input type="checkbox" id="trail" checked> Trail</label>
          <label class="ctrl-label"><input type="checkbox" id="mark" checked> Mark target</label>
          <button class="btn-reset" id="reset">Reset view</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Pop-Out Modal with Per-Photo Timeline & Data -->
  <div class="modal" id="modal">
    <div class="panel">
      <button class="close-btn" id="close">✕ Close</button>
      <div class="img-box">
        <img id="mImg" src="" alt="Destination Preview">
        <div class="reticle" id="reticle"></div>
        <div class="trail-line" id="trailLine"></div>
      </div>
      <div class="details">
        <div>
          <div class="tag" id="mFov"></div>
          <h2 id="mTitle"></h2>
          <p class="desc" id="mDesc"></p>

          <div class="stats">
            <div><span>Avg. distance</span><strong id="mDist"></strong></div>
            <div><span>Est. travel time</span><strong id="mTime"></strong></div>
            <div><span>Centre</span><strong id="mCentre"></strong></div>
            <div><span>Observation</span><strong id="mObs"></strong></div>
          </div>
        </div>

        <div class="date-input-row">
          <label for="customDate">See this sky on another date</label>
          <input type="text" id="customDate" placeholder="e.g. Aug 2026 DR2" />
          <button class="btn-show" id="applyDate">Show</button>
        </div>

        <div class="photo-timeline">
          <div class="tl-header">
            <span>Mission Timeline</span>
            <span id="tlActiveDate">May 2025 DR1</span>
          </div>
          <div class="tl-track-wrap" id="tlTrack">
            <div class="tl-base-line"></div>
            <div class="tl-progress-line" id="tlProgress"></div>
            <div class="tl-rocket" id="tlRocket">🚀</div>
            <div class="tl-nodes" id="tlNodes"></div>
          </div>
          <div class="tl-labels" id="tlLabels"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Pure Black Space Background with Subtle Twinkling Stars & Glowing Rings
    const canvas = document.getElementById("spaceCanvas");
    const ctx = canvas.getContext("2d");
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = Array.from({ length: 160 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random(),
        da: (Math.random() * 0.015 + 0.004) * (Math.random() > 0.5 ? 1 : -1)
      }));
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawBackground() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle deep-space ambient glow on pure black
      const grad = ctx.createRadialGradient(
        canvas.width * 0.5, canvas.height * 0.38, 20,
        canvas.width * 0.5, canvas.height * 0.38, Math.max(canvas.width, canvas.height) * 0.45
      );
      grad.addColorStop(0, "rgba(28, 38, 72, 0.22)");
      grad.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const s of stars) {
        s.a += s.da;
        if (s.a <= 0.15 || s.a >= 1) s.da *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.a.toFixed(2)})`;
        ctx.fill();
      }
      requestAnimationFrame(drawBackground);
    }
    drawBackground();

    // Generate built-in offline space preview images if 1.png..9.png are missing
    function makeFallbackImage(index, hue) {
      const c = document.createElement("canvas");
      c.width = 480;
      c.height = 480;
      const g = c.getContext("2d");
      g.fillStyle = "#04060c";
      g.fillRect(0, 0, 480, 480);

      const nebula = g.createRadialGradient(240, 220, 15, 240, 220, 210);
      nebula.addColorStop(0, `hsla(${hue}, 85%, 65%, 0.85)`);
      nebula.addColorStop(0.5, `hsla(${(hue + 40) % 360}, 70%, 35%, 0.35)`);
      nebula.addColorStop(1, "rgba(0, 0, 0, 0)");
      g.fillStyle = nebula;
      g.fillRect(0, 0, 480, 480);

      for (let i = 0; i < 90; i++) {
        g.fillStyle = `rgba(255,255,255,${Math.random() * 0.85 + 0.15})`;
        g.beginPath();
        g.arc(Math.random() * 480, Math.random() * 480, Math.random() * 1.8, 0, Math.PI * 2);
        g.fill();
      }
      return c.toDataURL("image/png");
    }

    // 9 Destinations, each with its own independent Timeline & Dataset
    const destinations = Array.from({ length: 9 }, (_, idx) => {
      const num = String(idx + 1).padStart(2, "0");
      const hue = (idx * 38 + 200) % 360;
      const baseDist = [384400, 54600000, 628300000, 1275000000, 2870000000, 4495000000, 1420000000, 778500000, 408][idx];
      const baseDays = ["3 days", "7 months", "3 years", "6 years", "9 years", "12 years", "7 years", "4 years", "6 hours"][idx];

      return {
        id: num,
        title: `Destination ${num}`,
        img: `${idx + 1}.png`,
        fallback: makeFallbackImage(idx + 1, hue),
        fov: `${(1.8 + idx * 0.3).toFixed(1)}° × ${(1.8 + idx * 0.3).toFixed(1)}°`,
        timeline: [
          {
            date: "May 2025 DR1",
            desc: `Details for ${idx + 1}.png go here. Initial DR1 wide-field infrared survey of Sector ${num}.`,
            dist: `${baseDist.toLocaleString()} km`,
            time: baseDays,
            centre: `RA ${String(10 + idx).padStart(2, "0")}h 15m`,
            filter: "none"
          },
          {
            date: "Nov 2025 DR2",
            desc: `Sector ${num} deep spectral pass during DR2 showing thermal dust structures and orbital drift.`,
            dist: `${Math.round(baseDist * 1.04).toLocaleString()} km`,
            time: baseDays,
            centre: `RA ${String(10 + idx).padStart(2, "0")}h 28m`,
            filter: "hue-rotate(35deg) contrast(1.12)"
          },
          {
            date: "May 2026 QR2",
            desc: `High-resolution QR2 follow-up on Destination ${num} tracking seasonal atmospheric shifts.`,
            dist: `${Math.round(baseDist * 0.97).toLocaleString()} km`,
            time: baseDays,
            centre: `RA ${String(10 + idx).padStart(2, "0")}h 41m`,
            filter: "hue-rotate(120deg) saturate(1.25)"
          },
          {
            date: "QR3 Nov 2026",
            desc: `Final QR3 calibration epoch for Destination ${num} confirming long-term trajectory stability.`,
            dist: `${Math.round(baseDist * 1.01).toLocaleString()} km`,
            time: baseDays,
            centre: `RA ${String(10 + idx).padStart(2, "0")}h 54m`,
            filter: "hue-rotate(210deg) brightness(1.12)"
          }
        ]
      };
    });

    const ring = document.getElementById("ring");
    const modal = document.getElementById("modal");
    const mImg = document.getElementById("mImg");
    let angle = 0, vel = 0, drag = false, startX = 0, moved = 0;

    // Build 9 Smaller Cards on the 3D Wheel
    destinations.forEach((d, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.transform = `rotateY(${i * 40}deg) translateZ(350px)`;
      card.innerHTML = `
        <img src="${d.img}" onerror="this.onerror=null;this.src='${d.fallback}'" alt="${d.title}">
        <div class="card-info">
          <span>Sector ${d.id}</span>
          <h3>${d.title}</h3>
        </div>
      `;
      card.onclick = () => {
        if (moved > 8) return;
        openDestinationModal(d);
      };
      ring.appendChild(card);
    });

    // 3D Wheel Drag & Spin Controls
    document.getElementById("vp").onpointerdown = e => {
      drag = true;
      startX = e.clientX;
      moved = 0;
      vel = 0;
    };
    window.onpointermove = e => {
      if (!drag) return;
      const dx = e.clientX - startX;
      moved += Math.abs(dx);
      angle += dx * 0.3;
      vel = dx * 0.3;
      startX = e.clientX;
    };
    window.onpointerup = () => { drag = false; };

    document.getElementById("spin").onclick = () => {
      vel = (Math.random() > 0.5 ? 1 : -1) * 14;
    };
    document.getElementById("reset").onclick = () => {
      angle = 0;
      vel = 0;
    };
    document.getElementById("mark").onchange = e => {
      document.getElementById("reticle").style.display = e.target.checked ? "block" : "none";
    };
    document.getElementById("trail").onchange = e => {
      document.getElementById("trailLine").style.display = e.target.checked ? "block" : "none";
    };

    (function spinLoop() {
      if (!drag) {
        angle += vel;
        vel *= 0.94;
        if (Math.abs(vel) < 0.04) angle -= 0.1;
      }
      ring.style.transform = `rotateY(${angle}deg)`;
      requestAnimationFrame(spinLoop);
    })();

    // Per-Photo Smooth Rocket Timeline State
    let activeDest = null;
    let currentPct = 0;
    let targetPct = 0;
    let scrubbingTimeline = false;

    const tlTrack = document.getElementById("tlTrack");
    const tlProgress = document.getElementById("tlProgress");
    const tlRocket = document.getElementById("tlRocket");
    const tlNodes = document.getElementById("tlNodes");
    const tlLabels = document.getElementById("tlLabels");

    function applyTimelineStep(stepIndex) {
      if (!activeDest) return;
      const step = activeDest.timeline[stepIndex];
      document.getElementById("mDesc").textContent = step.desc;
      document.getElementById("mDist").textContent = step.dist;
      document.getElementById("mTime").textContent = step.time;
      document.getElementById("mCentre").textContent = step.centre;
      document.getElementById("mObs").textContent = step.date;
      document.getElementById("tlActiveDate").textContent = step.date;
      mImg.style.filter = step.filter;

      document.querySelectorAll(".tl-node").forEach((n, idx) => {
        n.classList.toggle("active", idx === stepIndex);
      });
    }

    function openDestinationModal(dest) {
      activeDest = dest;
      mImg.src = dest.img;
      mImg.onerror = () => { mImg.onerror = null; mImg.src = dest.fallback; };

      document.getElementById("mFov").textContent = `Field of view: ${dest.fov}`;
      document.getElementById("mTitle").textContent = dest.title;
      document.getElementById("customDate").value = "";

      // Build nodes & labels for THIS photo's timeline
      tlNodes.innerHTML = "";
      tlLabels.innerHTML = "";
      const count = dest.timeline.length;

      dest.timeline.forEach((step, idx) => {
        const node = document.createElement("div");
        node.className = "tl-node" + (idx === 0 ? " active" : "");
        node.title = step.date;
        node.onclick = e => {
          e.stopPropagation();
          targetPct = (idx / (count - 1)) * 100;
          applyTimelineStep(idx);
        };
        tlNodes.appendChild(node);

        const lbl = document.createElement("span");
        lbl.textContent = step.date;
        tlLabels.appendChild(lbl);
      });

      currentPct = 0;
      targetPct = 0;
      applyTimelineStep(0);
      modal.classList.add("open");
    }

    function updateTimelineFromPointer(clientX) {
      if (!activeDest) return;
      const rect = tlTrack.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
      targetPct = pct;
      const count = activeDest.timeline.length;
      const nearestIdx = Math.round((pct / 100) * (count - 1));
      applyTimelineStep(nearestIdx);
    }

    tlTrack.onpointerdown = e => {
      scrubbingTimeline = true;
      updateTimelineFromPointer(e.clientX);
    };
    window.addEventListener("pointermove", e => {
      if (scrubbingTimeline) updateTimelineFromPointer(e.clientX);
    });
    window.addEventListener("pointerup", () => {
      scrubbingTimeline = false;
    });

    // Smooth 60fps Rocket & Progress Line Easing
    (function animateRocket() {
      currentPct += (targetPct - currentPct) * 0.14;
      tlProgress.style.width = `${currentPct}%`;
      tlRocket.style.left = `${currentPct}%`;
      requestAnimationFrame(animateRocket);
    })();

    // Write-In Date Option
    function applyWrittenDate() {
      const val = document.getElementById("customDate").value.trim();
      if (!val || !activeDest) return;
      document.getElementById("mObs").textContent = val;
      document.getElementById("tlActiveDate").textContent = val;
      document.getElementById("mDesc").textContent =
        `Custom epoch observation (${val}) for ${activeDest.title}. Spectral telemetry recalculated for requested date.`;
      mImg.style.filter = "hue-rotate(175deg) contrast(1.15)";
    }

    document.getElementById("applyDate").onclick = applyWrittenDate;
    document.getElementById("customDate").onkeydown = e => {
      if (e.key === "Enter") applyWrittenDate();
    };

    document.getElementById("close").onclick = () => modal.classList.remove("open");
    modal.onclick = e => { if (e.target === modal) modal.classList.remove("open"); };
  </script>
</body>
</html>
