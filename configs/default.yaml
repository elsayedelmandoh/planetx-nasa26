# default configuration (values only, loaded by src/core/settings.py)

PROJECT_NAME: planetx-nasa26

# spherex data releases to read (qr2 superseded by dr1+qr3)
DATA_RELEASES: ["spherex_dr1", "spherex_qr3"]

# field of view choices for the cutout, in arcminutes
FOV_PRESETS_ARCMIN: [2, 5, 15, 30]
DEFAULT_FOV_ARCMIN: 5

# parallel cutout downloads (irsa per-request latency dominates)
DOWNLOAD_WORKERS: 4
# max visits kept per survey pass, spread evenly in time
MAX_VISITS_PER_PASS: 25

# position epoch for TARGETS coords. proper motions below move the sources to the
# epoch of each run's mean visit time, see src/utils/data_processing.py.
POS_EPOCH: J2000.0

# the 5 benchmark targets from the brief (docs/requirements/01-quickinfo.md section 4).
# ra_deg/dec_deg stay the j2000 values shown in the ui; the astrometry block drives
# the cutout center, propagated to the middle of each run's visits (see src/utils/data_processing.py).
# pmra_mas_yr is mu_alpha* = mu_alpha * cos(dec). sources: gaia dr3, epoch 2016.0; wise 0855 not in gaia.
TARGETS:
  - name: WISE 0855
    ra_deg: 133.795129
    dec_deg: -7.245147
    kind: fast-moving brown dwarf
    astrometry:
      ra_deg: 133.795129
      dec_deg: -7.245147
      pmra_mas_yr: -8120.0
      pmdec_mas_yr: 670.0
      epoch: 2010.5
      source: "luhman and esplin 2016, unverified: simbad was down"
  - name: Barnard's Star
    ra_deg: 269.452075
    dec_deg: 4.693364
    kind: high proper-motion red dwarf
    astrometry:
      ra_deg: 269.44850252543836
      dec_deg: 4.739420051112412
      pmra_mas_yr: -801.5509783684709
      pmdec_mas_yr: 10362.394206546573
      epoch: 2016.0
      source: "gaia dr3 4472832130942575872"
  - name: Epsilon Indi B
    ra_deg: 331.044147
    dec_deg: -56.782844
    kind: binary brown dwarfs
    astrometry:
      ra_deg: 331.07645259656397
      dec_deg: -56.79381206688221
      pmra_mas_yr: 3981.97666296105
      pmdec_mas_yr: -2466.8318147663504
      epoch: 2016.0
      source: "gaia dr3 6412596012146801152"
  - name: RW Aurigae
    ra_deg: 76.956375
    dec_deg: 30.401389
    kind: variable star
    astrometry:
      ra_deg: 76.95608119552952
      dec_deg: 30.401204589097233
      pmra_mas_yr: 2.6406431770317083
      pmdec_mas_yr: -27.397582540455325
      epoch: 2016.0
      source: "gaia dr3 156430822114424576"
  - name: R Draconis
    ra_deg: 248.167625
    dec_deg: 66.755000
    kind: variable star
    astrometry:
      ra_deg: 248.1673783672889
      dec_deg: 66.75500674547219
      pmra_mas_yr: -20.642811719160797
      pmdec_mas_yr: 6.148818852711324
      epoch: 2016.0
      source: "gaia dr3 1648328016354496384"
