name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  space:
    runs-on: ubuntu-latest
    # skip until the space is configured: repo variable HF_SPACE=<user>/<space>, secret HF_TOKEN (write).
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # free static space (docker spaces need hf pro): only web/ ships, at the space root.
      # the readme frontmatter tells hugging face to serve index.html as a static site.
      - name: push web/ to hugging face space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          mkdir site && cp -r web/. site/
          printf -- '---\ntitle: planetx-nasa26\nsdk: static\napp_file: index.html\n---\n\nspherex blink tool. source: https://github.com/%s\n' "$GITHUB_REPOSITORY" > site/README.md
          cd site
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
