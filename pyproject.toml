[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planetx-nasa26"
version = "0.1.0"
description = "public web tool to blink spherex sky images over time"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "astropy>=6.1",
    "astroquery>=0.4.7",
    "reproject>=0.13",
    "scipy>=1.11",
    "pillow>=10.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# star imports are the repo convention (agents.md section 11)
ignore = ["F403", "F405"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: needs real provider credentials, skipped unless LIVE=1",
]
