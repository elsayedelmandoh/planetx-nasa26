name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  space:
    runs-on: ubuntu-latest
    # skip until the space is configured: repo variable HF_SPACE=<user>/<space>, secret HF_TOKEN (write).
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # hugging face builds the Dockerfile itself; it reads sdk and port from readme frontmatter,
      # so the frontmatter is added only to the pushed copy and the github readme stays clean.
      - name: push to hugging face space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          printf -- '---\ntitle: planetx-nasa26\nsdk: docker\napp_port: 8000\n---\n\n' | cat - README.md > README.tmp
          mv README.tmp README.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan space
          git add -A
          git commit -qm "deploy ${GITHUB_SHA}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space:main
